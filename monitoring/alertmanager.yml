route:
  receiver: default
  group_by: ["alertname"]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h
  routes:
    - matchers:
        - severity="critical"
      receiver: default
      repeat_interval: 15m

receivers:
  - name: default
    webhook_configs:
      # Récepteur de test utilisé pour la validation en bac à sable (voir
      # docs/monitoring.md) : à remplacer par un vrai canal (Slack, e-mail via
      # SMTP, PagerDuty...) avant un déploiement réel. Le champ `url` ci-dessous
      # cible un petit serveur HTTP local lancé uniquement pour le test.
      - url: "http://host.docker.internal:9099/alert"
        send_resolved: true

